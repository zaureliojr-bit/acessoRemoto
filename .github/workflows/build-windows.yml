name: Build executaveis Windows

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build AcessoRemoto.exe
        run: pyinstaller --onefile --noconsole --name AcessoRemoto app.py

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: acesso-remoto-windows
          path: dist/AcessoRemoto.exe
