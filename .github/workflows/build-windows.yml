name: Build executaveis Windows

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Definir versao do build
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "APP_VERSION = \"$SHORT_SHA\"" > version.py
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build AcessoRemoto.exe
        run: pyinstaller --onefile --noconsole --name AcessoRemoto app.py

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: acesso-remoto-windows
          path: dist/AcessoRemoto.exe

      - name: Publicar release com link estavel de download
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$SHORT_SHA" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "$SHORT_SHA" dist/AcessoRemoto.exe \
            --repo "${{ github.repository }}" \
            --title "AcessoRemoto ($SHORT_SHA)" \
            --notes "Build automático a partir do commit $SHORT_SHA."
